<style>
/* Fixed concept palettes are intentional: the palettes are the subject of this review. */
#wildcard-design-review .wc-app {
  --wc-red:#c22b31; --wc-bg:#191719; --wc-panel:#242124; --wc-soft:#302b2e;
  --wc-ink:#f5eee5; --wc-muted:#b9afad; --wc-line:#494044; --wc-accent:#dbc5a6;
  --wc-paper:#f3eadf; --wc-black:#211c1d; --wc-rad:12px; --wc-table:#373033;
  --wc-positive:#b5d4c1; --wc-shadow:#0c0b0b; --wc-white:#fffaf4;
  color-scheme:dark; color:var(--wc-ink); background:var(--wc-bg);
  font:14px/1.55 "Yu Gothic UI","Hiragino Sans","Meiryo",sans-serif;
  min-height:780px; overflow:clip; border-radius:14px; display:flex; flex-direction:column;
}
#wildcard-design-review .wc-paper {
  --wc-bg:#f3efe6; --wc-panel:#fffdf9; --wc-soft:#e9e2d6; --wc-ink:#292525;
  --wc-muted:#70645e; --wc-line:#d8cec2; --wc-accent:#a82931; --wc-rad:22px;
  --wc-table:#e7ddce; --wc-positive:#41634c; --wc-shadow:#d4cabc;
  color-scheme:light;
}
#wildcard-design-review .wc-ink {
  --wc-bg:#edede6; --wc-panel:#fafaf4; --wc-soft:#deded3; --wc-ink:#20211f;
  --wc-muted:#66675e; --wc-line:#252620; --wc-accent:#b0222a; --wc-rad:2px;
  --wc-table:#d4d4c6; --wc-positive:#3f6048; --wc-shadow:#262720;
  color-scheme:light;
}
#wildcard-design-review .wc-app * {box-sizing:border-box;}
#wildcard-design-review .wc-app [hidden] {display:none!important;}
#wildcard-design-review .wc-app h1,#wildcard-design-review .wc-app h2,#wildcard-design-review .wc-app h3,#wildcard-design-review .wc-app p {margin:0;}
#wildcard-design-review .wc-app button,#wildcard-design-review .wc-app input,#wildcard-design-review .wc-app select {font:inherit;}
#wildcard-design-review .wc-app button {color:inherit;}
#wildcard-design-review .wc-app button:disabled {opacity:.5;}
#wildcard-design-review .wc-app .wc-button {background:var(--wc-panel); border:1px solid var(--wc-line); border-radius:var(--wc-rad); padding:11px 17px; font-weight:650; min-height:44px;}
#wildcard-design-review .wc-app .wc-primary {background:var(--wc-red); color:#fffaf4; border-color:var(--wc-red);}
#wildcard-design-review .wc-app .wc-quiet {background:transparent; border:0; color:var(--wc-muted); padding:9px 8px; min-height:42px;}
#wildcard-design-review .wc-app .wc-small {font-size:12px;}
#wildcard-design-review .wc-app .wc-muted {color:var(--wc-muted);}
#wildcard-design-review .wc-app .wc-eyebrow {font-size:11px; font-weight:700; letter-spacing:.16em; color:var(--wc-accent);}
#wildcard-design-review .wc-app .wc-row {display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
#wildcard-design-review .wc-app .wc-between {justify-content:space-between;}
#wildcard-design-review .wc-app .wc-brand {display:flex;align-items:center;gap:9px; font-size:22px;letter-spacing:-.05em;font-weight:850;border:0;background:none;padding:0;}
#wildcard-design-review .wc-app .wc-avatar {display:block;width:38px;height:38px;flex:0 0 auto;overflow:hidden;position:relative; border-radius:50%; background:var(--wc-paper);}
#wildcard-design-review .wc-app .wc-avatar img {position:absolute;max-width:none;width:64px;left:-14px;top:-9px;}
#wildcard-design-review .wc-app .wc-header {min-height:75px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 30px;border-bottom:1px solid var(--wc-line);}
#wildcard-design-review .wc-app .wc-nav {display:flex;gap:5px;align-items:center;}
#wildcard-design-review .wc-app .wc-nav button {border:0;background:transparent;padding:9px 13px;border-radius:7px;min-height:42px;color:var(--wc-muted);font-size:13px;}
#wildcard-design-review .wc-app .wc-nav button[aria-pressed="true"] {background:var(--wc-soft);color:var(--wc-ink);}
#wildcard-design-review .wc-app .wc-page {min-height:626px;}
#wildcard-design-review .wc-app main {flex:1;}
#wildcard-design-review .wc-app .wc-statusbar {padding:12px 30px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--wc-line);font-size:11px;color:var(--wc-muted);letter-spacing:.04em;}
#wildcard-design-review .wc-app .wc-swatches {display:flex;align-items:center;gap:5px;}
#wildcard-design-review .wc-app .wc-swatches i {display:block;width:12px;height:12px;border-radius:50%;background:var(--swatch);border:1px solid var(--wc-line);}
#wildcard-design-review .wc-app .wc-hero {display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:center;padding:44px 52px 30px;}
#wildcard-design-review .wc-app .wc-hero h1 {font-size:43px;line-height:1.3;letter-spacing:-.04em;font-weight:800;margin:15px 0 17px;}
#wildcard-design-review .wc-app .wc-hero h1 em {font-style:normal;color:var(--wc-accent);}
#wildcard-design-review .wc-app .wc-hero-copy>p {color:var(--wc-muted);font-size:14px;line-height:1.9;margin-bottom:22px;}
#wildcard-design-review .wc-app .wc-hero-actions {display:flex;gap:9px;flex-wrap:wrap;}
#wildcard-design-review .wc-app .wc-mascot-stage {height:330px;position:relative;isolation:isolate;display:flex;justify-content:center;align-items:center;}
#wildcard-design-review .wc-app .wc-mascot-stage:before {content:"";position:absolute;inset:13px 22px 5px;border-radius:150px 150px 30px 30px;background:var(--wc-paper);z-index:-1;}
#wildcard-design-review .wc-app .wc-mascot-stage>img {height:345px;width:auto;max-width:100%;object-fit:contain;transform:rotate(4deg);}
#wildcard-design-review .wc-app .wc-mascot-caption {position:absolute;bottom:8px;left:50%;transform:translateX(-50%) rotate(-5deg);white-space:nowrap;background:var(--wc-red);color:#fffaf4;border:1px solid var(--wc-red);border-radius:4px;padding:6px 15px;font-size:10px;letter-spacing:.15em;font-weight:800;}
#wildcard-design-review .wc-app .wc-home-bottom {padding:2px 52px 32px;}
#wildcard-design-review .wc-app .wc-mode-list {display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--wc-line);border-bottom:1px solid var(--wc-line);}
#wildcard-design-review .wc-app .wc-mode {text-align:left;padding:20px 18px;background:transparent;border:0;border-right:1px solid var(--wc-line);}
#wildcard-design-review .wc-app .wc-mode:last-child {border-right:0;}
#wildcard-design-review .wc-app .wc-mode strong {display:block;font-size:15px;margin-bottom:4px;}
#wildcard-design-review .wc-app .wc-mode span {display:block;font-size:12px;color:var(--wc-muted);}
#wildcard-design-review .wc-app .wc-rule-link {margin-top:14px;display:flex;gap:15px;align-items:center;justify-content:space-between;}
#wildcard-design-review .wc-paper .wc-brand {font-family:Georgia,serif;font-size:27px;font-weight:700;}
#wildcard-design-review .wc-paper .wc-hero {grid-template-columns:.8fr 1.2fr;padding:30px 42px 20px;gap:24px;}
#wildcard-design-review .wc-paper .wc-mascot-stage {order:-1;height:300px;}
#wildcard-design-review .wc-paper .wc-mascot-stage:before {border-radius:50%;inset:10px 0;background:var(--wc-soft);}
#wildcard-design-review .wc-paper .wc-mascot-stage>img {height:315px;transform:rotate(-5deg);}
#wildcard-design-review .wc-paper .wc-hero h1 {font-size:37px;line-height:1.45;}
#wildcard-design-review .wc-paper .wc-home-bottom {padding:10px 42px 30px;}

 #wildcard-design-review .wc-app .wc-statusbar {padding:12px 18px;}
 #wildcard-design-review .wc-paper .wc-mode-list {display:grid;grid-template-columns:1fr;gap:8px;}
 #wildcard-design-review .wc-paper .wc-mode {padding:14px 17px;border:1px solid var(--wc-line);border-radius:14px;}
 #wildcard-design-review .wc-paper .wc-mode:last-child {border-bottom:1px solid var(--wc-line);}
 #wildcard-design-review .wc-paper .wc-rule-link {margin-top:16px;}
 #wildcard-design-review .wc-ink .wc-hero {padding:0;gap:0;}
 #wildcard-design-review .wc-ink .wc-hero-copy {padding:22px;}
 #wildcard-design-review .wc-ink .wc-hero h1 {font-size:43px;line-height:1.1;}
 #wildcard-design-review .wc-ink .wc-mascot-stage {margin-top:0;border:0;border-top:2px solid var(--wc-line);height:225px;}
 #wildcard-design-review .wc-ink .wc-mascot-stage>img {height:237px;}
 #wildcard-design-review .wc-ink .wc-mascot-stage:before {inset:20px 20%;}
 #wildcard-design-review .wc-ink .wc-home-bottom {padding:0;}
 #wildcard-design-review .wc-ink .wc-mode {padding:16px 23px;border-bottom:2px solid var(--wc-line);}
 #wildcard-design-review .wc-ink .wc-rule-link {padding:13px 23px;}
 #wildcard-design-review .wc-ink .wc-settings-nav button {border-bottom:0;}
 #wildcard-design-review .wc-ink .wc-settings-summary {border:2px solid var(--wc-line);}
}
@media (pointer:coarse) {
 #wildcard-design-review .wc-app .wc-rank-controls button {min-width:44px;min-height:44px;}
 #wildcard-design-review .wc-app .wc-settings-nav button {min-height:44px;}
}
</style>
<script>
(() => {
  const root = document.getElementById('wildcard-design-review');
  const character = root.querySelector('#wc-original-character').content.querySelector('img').src;
  const configs = {
    velvet: {name:'VELVET CLUB', tag:'YOUR TABLE. YOUR RULES.', title:'今夜は、<br><em>僕らのルールで。</em>', intro:'いつもの仲間と、ひと味ちがうポーカー。<br>ルールを決めて、テーブルを囲もう。', stamp:'WELCOME TO THE CLUB', palette:['#c22b31','#191719','#f3eadf','#dbc5a6'], category:'ranking'},
    paper: {name:'PAPER LOUNGE', tag:'A LITTLE WILD. A LOT OF FUN.', title:'好きな仲間と。<br><em>好きなルールで。</em>', intro:'ジョーカーを足しても、エースを弱くしても。<br>ここは、みんなでつくるカードルーム。', stamp:'MAKE YOURSELF AT HOME', palette:['#c22b31','#f3efe6','#292525','#e9e2d6'], category:'basic'},
    ink: {name:'WILD INK', tag:'POKER, YOUR WAY.', title:'PLAY IT<br><em>YOUR WAY.</em>', intro:'ルールだって、遊び道具。<br>自分たちだけのポーカーをはじめよう。', stamp:'HOUSE RULES APPLY', palette:['#c22b31','#20211f','#edede6','#d4d4c6'], category:'ranking'}
  };
  const states = {};
  const image = (className='') => `<img class="${className}" src="${character}" alt="赤いドラゴンのディーラー">`;
  const avatar = () => `<span class="wc-avatar" aria-hidden="true">${image()}</span>`;
  const button = (text, attrs='', style='') => `<button type="button" class="wc-button cursor-interaction ${style}" ${attrs}>${text}</button>`;
  const quiet = (text,attrs='') => `<button type="button" class="wc-quiet cursor-interaction" ${attrs}>${text}</button>`;
  const card = (rank,suit) => `<span class="wc-playing-card ${['♥','♦'].includes(suit)?'wc-red-card':''}" data-suit="${suit}" role="img" aria-label="${rank}${suit}">${rank}<span>${suit}</span></span>`;
  const example = () => `<div class="wc-rule-example"><p>成立する手の例 · フラッシュ</p><div class="wc-cards">${card('A','♥')+card('J','♥')+card('8','♥')+card('6','♥')+card('2','♥')}</div></div>`;
  const categories = [['basic','卓の基本'],['deck','デッキ'],['structure','配り方'],['ranking','役の強さ'],['betting','ベット'],['options','卓の作法']];
  function home(design,c) {
    const markers = design==='paper'?['♠','♣','♦']:design==='ink'?['PLAY ONLINE','SOLO SESSION','PASS & PLAY']:['','',''];
    return `<div class="wc-hero">
      <div class="wc-hero-copy"><div class="wc-eyebrow">${c.tag}</div><h1>${c.title}</h1><p>${c.intro}</p>
        <div class="wc-hero-actions">${button('部屋を作る →','data-go="settings" data-category="basic"','wc-primary')}${button('コードで参加','data-join="true"')}</div>
      </div>
      <div class="wc-mascot-stage">${image()}<span class="wc-mascot-caption">${c.stamp}</span></div>
    </div>
    <div class="wc-home-bottom">
      <div class="wc-mode-list">
        <button class="wc-mode cursor-interaction" type="button" data-go="settings" data-category="basic">${markers[0]?`<b>${markers[0]}</b>`:''}<strong>仲間とオンライン ↗</strong><span>離れていても、同じテーブルに。</span></button>
        <button class="wc-mode cursor-interaction" type="button" data-go="game">${markers[1]?`<b>${markers[1]}</b>`:''}<strong>ひとりで練習 ↗</strong><span>CPU相手に、新しいルールを試そう。</span></button>
        <button class="wc-mode cursor-interaction" type="button" data-go="settings" data-category="basic">${markers[2]?`<b>${markers[2]}</b>`:''}<strong>1台を囲んで ↗</strong><span>端末を回して遊ぶホットシート。</span></button>
      </div>
      <div class="wc-join" hidden>
        <div class="wc-field-pair" style="margin-top:18px"><label class="wc-field">あなたの名前<input placeholder="名前を入力" maxlength="12"></label><label class="wc-field">ルームコード<input placeholder="ABCDEF" maxlength="6" autocapitalize="characters"></label></div>
        ${button('参加画面を見る →','data-go="game"','wc-primary')}
      </div>
      <div class="wc-rule-link"><span class="wc-small wc-muted">普通のポーカーも、ちょっと変わったポーカーも。</span>${quiet('自分たちのルールを作る →','data-go="settings" data-category="ranking"')}</div>
    </div>`;
  }
  function game() {
    return `<div class="wc-game-meta"><div class="wc-row"><strong>いつものテーブル</strong><span class="wc-chip-label">ホールデム</span></div><div class="wc-small wc-muted">#08 · SB 10 / BB 20 · 進行役 Haru</div></div>
      <div class="wc-game-layout">
        <div class="wc-table-wrap" role="group" aria-label="4人のポーカーテーブル。フロップ、ポット120。あなたの手札はエースとキング。">
          <div class="wc-felt"></div>
          <div class="wc-board"><div class="wc-pot"><small>FLOP · POT</small><span data-pot>120</span></div><div class="wc-cards">${card('A','♥')+card('8','♣')+card('5','♦')}<span class="wc-playing-card wc-slot" aria-label="未公開のターン"></span><span class="wc-playing-card wc-slot" aria-label="未公開のリバー"></span></div></div>
          <div class="wc-seat wc-seat-top"><span>Haru</span><strong>940</strong><em>ベット 20</em><span class="wc-dealer">D</span></div>
          <div class="wc-seat wc-seat-left"><span>Mika</span><strong>960</strong><em>チェック</em></div>
          <div class="wc-seat wc-seat-right"><span>Ren</span><strong>1,020</strong><em>フォールド</em></div>
          <div class="wc-seat wc-seat-you"><div class="wc-cards">${card('A','♠')+card('K','♦')}</div><span>あなた</span><strong data-stack>960</strong></div>
        </div>
        <aside class="wc-game-aside"><h3>このハンド</h3><div class="wc-log">フロップを公開<br>Mika チェック<br>Haru ベット 20<br><strong>あなたの番</strong></div>${avatar()}<p class="wc-small wc-muted">この卓のルール</p><p class="wc-small">52枚 / 手札2枚<br>ノーリミット</p>${quiet('詳細を見る →','data-go="settings" data-category="ranking"')}</aside>
      </div>
      <div class="wc-actions"><div class="wc-action-top"><span class="wc-turn" data-action-status aria-live="polite">● あなたの番です</span><span class="wc-muted">コールに必要なチップ <strong>20</strong></span></div>
        <div class="wc-raise"><input aria-label="レイズ総額" type="range" min="40" max="960" step="20" value="80" data-raise><output>80</output>${quiet('1/2 POT','data-amount="80"')}${quiet('POT','data-amount="160"')}${quiet('ALL IN','data-amount="960"')}</div>
        <div class="wc-action-controls">${button('フォールド','data-action="fold"')}${button('コール 20','data-action="call"')}${button('レイズ 80','data-action="raise"','wc-primary')}</div>
      </div>`;
  }
  function settings(design,c) {
    return `<div class="wc-settings-head"><div><div class="wc-eyebrow">MAKE YOUR HOUSE RULES</div><h1>${design==='ink'?'ルールを、つくろう。':'自分たちのルールを作る'}</h1></div>${quiet('← トップへ','data-go="home"')}</div>
    <div class="wc-settings-layout">
      <nav class="wc-settings-nav" aria-label="設定項目">${categories.map(([id,name])=>`<button class="cursor-interaction" type="button" data-setting="${id}" aria-pressed="${id===c.category}">${name}</button>`).join('')}</nav>
      <section class="wc-setting-content" aria-label="ルール編集"></section>
      <aside class="wc-settings-summary">${design==='paper'?avatar():''}<div class="wc-eyebrow">YOUR TABLE</div><h3>いつものハウスルール</h3><dl class="wc-summary-list"><div><dt>デッキ</dt><dd>52枚</dd></div><div><dt>手札</dt><dd>2枚</dd></div><div><dt>参加人数</dt><dd>4人</dd></div><div><dt>初期チップ</dt><dd>1,000</dd></div></dl><div class="wc-valid" data-save-status aria-live="polite">✓ この設定でプレイできます</div>${button('ルールを保存','data-save="true"','wc-primary')}${quiet('このルールで試す →','data-go="game"')}<div class="wc-helper">${design!=='paper'?avatar():''}<span>仲間に合わせて、<br>少しずつ変えていこう。</span></div></aside>
    </div>`;
  }
  function settingContent(category,design) {
    if(category==='basic') return `<h2 class="wc-panel-title">卓の基本</h2><label class="wc-field">ルールの名前<input value="いつものハウスルール" maxlength="24"></label><label class="wc-field">元にするルール<select><option>テキサスホールデム（標準）</option><option>オマハ（ポットリミット）</option><option>ショートデッキ（6+）</option><option>ジョーカー1枚</option></select></label><div class="wc-field-pair"><label class="wc-field">参加人数<select><option>2人</option><option>3人</option><option selected>4人</option><option>6人</option></select></label><label class="wc-field">初期チップ<input type="number" value="1000" min="20" step="100"></label></div><div class="wc-field-pair"><label class="wc-field">スモールブラインド<input type="number" min="1" value="10"></label><label class="wc-field">ビッグブラインド<input type="number" min="1" value="20"></label></div>`;
    if(category==='ranking') return `<h2 class="wc-panel-title">役の強さ</h2><p class="wc-small wc-muted" style="margin-bottom:12px">上にある役ほど強い。矢印で入れ替え。</p><ol class="wc-ranking">${['ストレートフラッシュ','フォーカード','フルハウス','フラッシュ','ストレート'].map((name,i)=>`<li><strong>${name}</strong><span class="wc-rank-controls"><button type="button" class="cursor-interaction" data-move="-1" aria-label="${name}を強くする" ${i===0?'disabled':''}>↑</button><button type="button" class="cursor-interaction" data-move="1" aria-label="${name}を弱くする" ${i===4?'disabled':''}>↓</button></span></li>`).join('')}</ol><p class="wc-small wc-muted" style="margin-top:10px">以下、スリーカード / ツーペア / ワンペア / ハイカード</p>${example()}`;
    if(category==='deck') return `<h2 class="wc-panel-title">デッキ</h2><label class="wc-field">使用するカード<select><option>標準 · 52枚</option><option>ショートデッキ · 36枚</option></select></label><div class="wc-field-pair"><label class="wc-field">ジョーカー<select><option>なし</option><option>1枚</option><option>2枚</option></select></label><label class="wc-field">ワイルドカード<select><option>なし</option><option>すべての2</option><option>片目のジャック</option></select></label></div><label class="wc-options-row"><span>♠ スペードを使う</span><input type="checkbox" checked></label><label class="wc-options-row"><span>♥ ハートを使う</span><input type="checkbox" checked></label><label class="wc-options-row"><span>♦ ダイヤを使う</span><input type="checkbox" checked></label><label class="wc-options-row"><span>♣ クラブを使う</span><input type="checkbox" checked></label>`;
    if(category==='structure') return `<h2 class="wc-panel-title">配り方</h2><div class="wc-field-pair"><label class="wc-field">手札の枚数<select><option>2枚</option><option>4枚</option></select></label><label class="wc-field">フロップの枚数<select><option>3枚</option><option>6枚</option></select></label></div><label class="wc-field">役に使える手札<select><option>枚数の制限なし</option><option>ちょうど2枚</option></select></label><p class="wc-small wc-muted">標準では、手札と場のカードから5枚を選んで役を作ります。</p>${example()}`;
    if(category==='betting') return `<h2 class="wc-panel-title">ベット</h2><label class="wc-field">ベットの方式<select><option>ノーリミット</option><option>ポットリミット</option><option>フィックスリミット</option></select></label><label class="wc-options-row"><span>ストラドルを許可する</span><input type="checkbox"></label><label class="wc-options-row"><span>プリフロップでオールインできる</span><input type="checkbox" checked></label><label class="wc-field" style="margin-top:20px">行動の持ち時間<select><option>制限なし</option><option>30秒</option><option>60秒</option></select></label>`;
    return `<h2 class="wc-panel-title">卓の作法</h2><label class="wc-options-row"><span>ラビットハントを許可する</span><input type="checkbox" checked></label><p class="wc-small wc-muted" style="margin:8px 0 14px">途中で勝負が決まったあと、残りの場のカードを見る。</p><label class="wc-options-row"><span>ランイットトゥワイスを許可する</span><input type="checkbox" checked></label><p class="wc-small wc-muted" style="margin:8px 0 14px">全員の同意で2回配り、それぞれの結果でポットを分ける。</p><label class="wc-options-row"><span>ディーラーの配り間違いを再現する</span><input type="checkbox"></label>`;
  }
  function remember() {
    const saved = {};
    for(const [name,s] of Object.entries(states)) saved[name]={screen:s.screen,category:s.category};
    if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{designReview:saved},privateContent:null}).catch(()=>{});
  }
  function navigate(app,screen,save=true) {
    // Keep the selected screen shared so changing the design compares the same task.
    root.querySelectorAll('.wc-app').forEach(surface=>{
      states[surface.dataset.design].screen=screen;
      surface.dataset.currentScreen=screen;
      surface.querySelectorAll('[data-page]').forEach(p=>{p.hidden=p.dataset.page!==screen;});
      surface.querySelectorAll('[data-screen-nav]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.go===screen)));
    });
    if(save)remember();
  }
  function setCategory(app,category,save=true) {
    const s=states[app.dataset.design]; s.category=category;
    app.querySelector('.wc-setting-content').innerHTML=settingContent(category,app.dataset.design);
    app.querySelectorAll('[data-setting]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.setting===category)));
    if(save)remember();
  }
  function restore(snapshot) {
    const values=snapshot?.modelContent?.designReview;
    if(!values)return;
    for(const app of root.querySelectorAll('.wc-app')) {
      const v=values[app.dataset.design]; if(!v)continue;
      if(['home','game','settings'].includes(v.screen))navigate(app,v.screen,false);
      if(categories.some(([id])=>id===v.category))setCategory(app,v.category,false);
    }
  }
  root.querySelectorAll('.wc-app').forEach(app=>{
    const design=app.dataset.design, c=configs[design];
    states[design]={screen:'home',category:c.category};
    app.dataset.currentScreen='home';
    app.innerHTML=`<header class="wc-header"><button class="wc-brand cursor-interaction" type="button" data-go="home" aria-label="Wildcard トップ">${avatar()}<span>Wildcard<span style="color:var(--wc-red)">.</span></span></button><nav class="wc-nav" aria-label="プレビューする画面"><button class="cursor-interaction" data-screen-nav type="button" data-go="home" aria-pressed="true">トップ</button><button class="cursor-interaction" data-screen-nav type="button" data-go="game" aria-pressed="false">ゲーム</button><button class="cursor-interaction" data-screen-nav type="button" data-go="settings" aria-pressed="false">設定・ルール</button></nav></header><main><div class="wc-page" data-page="home">${home(design,c)}</div><div class="wc-page" data-page="game" hidden>${game()}</div><div class="wc-page" data-page="settings" hidden>${settings(design,c)}</div></main><footer class="wc-statusbar"><span>${c.name} · 画面デザイン / 操作はプレビュー</span><span class="wc-swatches" aria-label="この案の配色">${c.palette.map(color=>`<i style="--swatch:${color}" aria-hidden="true"></i>`).join('')}<span style="margin-left:5px">${c.palette[0].toUpperCase()}</span></span></footer>`;
    setCategory(app,c.category,false);
    app.addEventListener('click',e=>{
      const b=e.target.closest('button'); if(!b)return;
      if(b.dataset.go){if(b.dataset.category)setCategory(app,b.dataset.category,false);navigate(app,b.dataset.go);}
      if(b.dataset.setting)setCategory(app,b.dataset.setting);
      if(b.dataset.join){const pane=app.querySelector('.wc-join');pane.hidden=!pane.hidden;if(!pane.hidden)pane.querySelector('input').focus();}
      if(b.dataset.amount){const range=app.querySelector('[data-raise]');range.value=b.dataset.amount;range.dispatchEvent(new Event('input',{bubbles:true}));}
      if(b.dataset.action){
        const action=b.dataset.action, value=action==='raise'?Number(app.querySelector('[data-raise]').value):action==='call'?20:0;
        app.querySelector('[data-action-status]').textContent=action==='fold'?'フォールドを選択':`${action==='raise'?'レイズ':'コール'} ${value} を選択`;
        app.querySelector('[data-pot]').textContent=120+value;
        app.querySelector('[data-stack]').textContent=(960-value).toLocaleString();
      }
      if(b.dataset.save){app.querySelector('[data-save-status]').textContent='✓ 保存後の表示プレビュー';b.textContent='保存しました';}
      if(b.dataset.move){
        const li=b.closest('li'),list=li.parentElement,dir=Number(b.dataset.move),other=dir<0?li.previousElementSibling:li.nextElementSibling;
        if(other){if(dir<0)list.insertBefore(li,other);else list.insertBefore(other,li);}
        [...list.children].forEach((row,i)=>{row.querySelector('[data-move="-1"]').disabled=i===0;row.querySelector('[data-move="1"]').disabled=i===list.children.length-1;});
      }
    });
    app.addEventListener('input',e=>{
      if(e.target.matches('[data-raise]')){app.querySelector('output').textContent=e.target.value;app.querySelector('[data-action="raise"]').textContent=`レイズ ${e.target.value}`;}
    });
    if(globalThis.Tweak){
      const values={red:'#c22b31',radius:design==='velvet'?12:design==='paper'?22:2};
      const tweak=new Tweak({container:app,onChange:()=>{app.style.setProperty('--wc-red',values.red);app.style.setProperty('--wc-rad',`${values.radius}px`);}});
      tweak.addColorPicker(values,'red',{label:'ブランドの赤',reference:'--wc-red'});
      tweak.addSlider(values,'radius',{label:'ボタンの角丸',min:0,max:28,unit:'px',reference:'--wc-rad'});
    }
  });
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)restore(event.detail.globals.widgetState);});
})();
</script>
