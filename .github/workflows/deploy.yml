name: Deploy to GitHub Pages

# Pages のプレビューを配信する。クラブ用サーバーの公開は別の手順で行う。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 連続で push されたとき、走っているデプロイは止めずに最新を待たせる。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: テスト
        run: npm test

      - name: ビルド
        run: npm run build
        env:
          VITE_TABLE_SERVER_URL: ${{ vars.WILDCARD_TABLE_SERVER_URL }}

      - name: サーバーのビルド確認
        run: npm run build:server

      - name: サーバーの通信・復旧確認
        run: npm run verify:server

      # enablement: true で Pages 自体をワークフローから有効化する。
      # リポジトリ設定で Source を GitHub Actions にし忘れていても、
      # ここが自分で設定してくれるので取りこぼさない。
      - uses: actions/configure-pages@v5
        with:
          enablement: true


      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
